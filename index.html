<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Yusuf Keder | Finans Merkezi</title>
<style>
:root{--p:#6d28d9;--pl:#ede9fe;--bg:#f7f5fb;--c:#fff;--t:#1f1b2e;--m:#6b6880;--g:#15803d;--r:#b91c1c;--b:#e6e2f0}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--t);padding-bottom:90px}
header{position:sticky;top:0;background:var(--c);border-bottom:1px solid var(--b);padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;z-index:5}
h1{font-size:17px;margin:0 0 8px;color:var(--p)}main{max-width:760px;margin:0 auto;padding:14px}
.tabs{display:flex;gap:6px}.tabs button{flex:1;padding:9px;border:1px solid var(--b);background:var(--c);border-radius:10px;font-size:14px}
.tabs .on{background:var(--p);color:#fff;border-color:var(--p)}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.k{font-size:12px;color:var(--m)}.v{font-size:19px;font-weight:700}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}.split .card{margin:0}.income{border-top:4px solid var(--g)}.expense{border-top:4px solid var(--r)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--b)}.row:last-child{border:0}
.pos{color:var(--g)}.neg{color:var(--r)}.s{font-size:12px;color:var(--m)}h3{margin:0 0 8px;font-size:15px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--c);border-top:1px solid var(--b);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;padding:12px 2px;border:0;background:none;font-size:12px;color:var(--m)}nav .on{color:var(--p);font-weight:700}
.fab{position:fixed;right:16px;bottom:calc(70px + env(safe-area-inset-bottom));background:var(--p);color:#fff;border:0;border-radius:28px;padding:15px 20px;font-size:16px;font-weight:700;box-shadow:0 6px 18px #6d28d96b;z-index:6}
input,select,button.b{font:inherit}input,select{width:100%;padding:12px;border:1px solid var(--b);border-radius:10px;margin:4px 0 10px;background:#fff}
label{font-size:12px;color:var(--m)}button.b{padding:12px 16px;border:0;border-radius:10px;background:var(--p);color:#fff;font-weight:600}
button.o{background:var(--pl);color:var(--p)}button.d{background:#fee2e2;color:var(--r)}
.mod{position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--c);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#1f1b2e;color:#fff;padding:10px 16px;border-radius:10px;z-index:30;font-size:14px;display:none}
.warn{background:#fef3c7;color:#92400e;border-radius:10px;padding:10px;font-size:13px;margin-bottom:12px}
.accountbar{background:#f8f7ff;border:1px solid var(--b);border-radius:10px;padding:10px;margin-bottom:10px}.accountbar input{display:inline-block;width:32%;margin:8px 5px 0 0;padding:8px}.accountbar button{margin-top:8px}
</style></head><body>
<div id="toast"></div><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ===== AYAR: Supabase bilgilerini buraya yazın (anon/publishable anahtar; service_role ASLA) ===== */
const CFG={url:'https://pifytocnfnowzgigjrrz.supabase.co',key:'sb_publishable_KuLAJDhKoilvgvE7XAlbTQ_nzV_4ubj'};
/* ================================================================================================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const TL=k=>(k/100).toLocaleString('tr-TR',{style:'currency',currency:'TRY'});
const parseTL=v=>{v=String(v).trim();v=v.includes(',')?v.replace(/\./g,'').replace(',','.'):v;const n=Math.round(parseFloat(v)*100);return isFinite(n)?n:NaN};
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const CATK=['Yeme içme','Market','Ulaşım','Motor ve araç','Giyim','Sağlık','Eğlence','Abonelik','Alışveriş','Diğer'];
const CATI=['Malzeme','Meyve','Sos','Çikolata','Süsleme','Ambalaj','Personel','Kira','Elektrik','Su','İnternet','Kurye ve teslimat','Platform komisyonu','Vergi','Banka masrafları','Bakım ve ekipman','Pazarlama','Diğer'];
const GEL=['Waffle satışı','Trendyol Yemek','Yemeksepeti','WhatsApp','Dükkân','Maaş/Diğer gelir'];
const TYPES={gelir:'Gelir',gider:'Gider',transfer:'Hesaplar arası transfer / kart ödemesi',borc_al:'Borç alma',borc_ode:'Borç ödeme',alacak_ver:'Alacak oluşturma',alacak_tahsil:'Alacak tahsilatı',sermaye:'İşletmeye sermaye aktarma',cekme:'İşletmeden şahsi para çekme'};
let S,SC='h',V='home',user=null,sb=null,sync='',fid='',timer;
const seed=()=>({u:0,log:[],tx:[],accounts:[
['Kuveyt Türk — Normal TL','bank','k'],['Kuveyt Türk — Şeker Krizi','bank','i'],['Garanti — Normal TL','bank','k'],['Garanti — POS','bank','i'],['Enpara — TL','bank','k'],
['Kuveyt Türk Kredi Kartı','card','h',2000000],['Garanti Kredi Kartı','card','h',4000000],['Yusuf — Nakit cüzdan','cash','k'],['Şeker Krizi — Nakit kasa','cash','i']
].map(a=>({id:uid(),name:a[0],kind:a[1],scope:a[2],limit:a[3]||0,open:0,arch:0,u:Date.now()}))});
const key=()=>'fm2_'+(user?user.id:'local');
function load(){try{S=JSON.parse(localStorage.getItem(key()))}catch(e){}if(!S||!S.accounts)S=seed()}
function save(){S.u=Date.now();localStorage.setItem(key(),JSON.stringify(S));if(sb&&user){sync='⏳ Eşitleniyor…';clearTimeout(timer);timer=setTimeout(push,800)}render()}
function mergeL(a,b){const m=new Map();[...a,...b].forEach(x=>{const o=m.get(x.id);if(!o||(x.u||0)>(o.u||0))m.set(x.id,x)});return [...m.values()]}
function merge(a,b){return{u:Math.max(a.u||0,b.u||0),accounts:mergeL(a.accounts||[],b.accounts||[]),tx:mergeL(a.tx||[],b.tx||[]),log:mergeL(a.log||[],b.log||[])}}
async function pull(){const{data,error}=await sb.from('app_state').select('data').eq('user_id',user.id).maybeSingle();if(error)throw error;if(data&&data.data&&data.data.accounts)S=merge(S,data.data);localStorage.setItem(key(),JSON.stringify(S))}
async function push(){try{await pull();const{error}=await sb.from('app_state').upsert({user_id:user.id,data:S,updated_at:new Date().toISOString()});if(error)throw error;sync='☁️ Eşitlendi';}catch(e){sync='⚠️ Eşitlenemedi (yerel kayıtlı, tekrar denenecek)'}render()}
addEventListener('online',()=>{if(sb&&user)push()});
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2600)}
/* --- hesap motoru: bakiyeler yalnızca işlem kayıtlarından hesaplanır --- */
const live=()=>S.tx.filter(t=>!t.del);
function fx(t){const a=t.amt;switch(t.type){case'gelir':case'borc_al':case'alacak_tahsil':return[[t.acc,a]];case'gider':case'borc_ode':case'alacak_ver':return[[t.acc,-a]];case'transfer':case'sermaye':case'cekme':return[[t.acc,-a],[t.to,a]];case'duz':return[[t.acc,t.dir*a]]}return[]}
function bal(a){let d=0;live().forEach(t=>fx(t).forEach(([i,v])=>{if(i===a.id)d+=v}));return a.kind==='card'?a.open-d:a.open+d} // kartta değer = borç
const inSc=a=>SC==='h'||a.scope===SC||a.scope==='h';
const accs=()=>S.accounts.filter(a=>!a.arch);
function debts(){const m={};live().forEach(t=>{const k=t.type==='borc_al'?['b',1]:t.type==='borc_ode'?['b',-1]:t.type==='alacak_ver'?['a',1]:t.type==='alacak_tahsil'?['a',-1]:null;if(!k)return;const id=k[0]+'|'+(t.person||'—')+'|'+t.scope;m[id]=m[id]||{k:k[0],p:t.person||'—',sc:t.scope,v:0};m[id].v+=k[1]*t.amt});return Object.values(m).filter(x=>x.v!==0&&(SC==='h'||x.sc===SC))}
function stats(){const ms=today().slice(0,7),T=live().filter(t=>t.date.slice(0,7)===ms);const sum=(f)=>T.filter(f).reduce((s,t)=>s+t.amt,0);
const cash=accs().filter(a=>a.kind!=='card'&&inSc(a)).reduce((s,a)=>s+bal(a),0),card=accs().filter(a=>a.kind==='card').reduce((s,a)=>s+bal(a),0),D=debts(),bo=D.filter(x=>x.k==='b').reduce((s,x)=>s+x.v,0),al=D.filter(x=>x.k==='a').reduce((s,x)=>s+x.v,0);
const ig=sum(t=>t.type==='gelir'&&t.scope==='i'),ie=sum(t=>t.type==='gider'&&t.scope==='i');
return{cash,card,bo,al,net:cash-card-bo+al,kg:sum(t=>t.type==='gider'&&t.scope==='k'),ig,ie,ik:ig-ie}}
/* --- arayüz --- */
function render(){
const nav=[['home','Genel'],['tx','İşlemler'],['acc','Hesaplar'],['debt','Borç/Alacak'],['set','Ayarlar']];
const accountBox=user?`<div class="accountbar">☁️ ${esc(user.email)} <button class="b o" style="padding:5px 9px;font-size:12px" onclick="sb.auth.signOut()">Çıkış</button></div>`:`<div class="accountbar"><b>Telefon ve bilgisayar senkronizasyonu</b><div class="s">Hesap oluşturarak kayıtlarını cihazlar arasında kullan.</div><input id="em" type="email" placeholder="E-posta" autocomplete="username"><input id="pw" type="password" placeholder="Şifre" autocomplete="new-password"><button class="b" onclick="auth(0)">Giriş yap</button> <button class="b o" onclick="auth(1)">Kayıt ol</button>${sb?'':'<div class="s neg" style="margin-top:6px">Bulut bağlantısı henüz kurulmadı. Supabase ayarları eklenince hesap sistemi aktifleşir.</div>'}</div>`;
$('#app').innerHTML=`<header><h1>Yusuf Keder | Finans Merkezi</h1>${accountBox}<div class="tabs">${[['h','Genel'],['k','Kişisel'],['i','Şeker Krizi']].map(x=>`<button class="${SC===x[0]?'on':''}" onclick="SC='${x[0]}';render()">${x[1]}</button>`).join('')}</div></header>
<main>${sb?'':'<div class="warn">Yerel mod: veriler yalnızca bu cihazın tarayıcısında durur. Telefon ve bilgisayar arasında otomatik geçiş için Supabase URL/anon anahtarını ekleyip veritabanında app_state tablosunu oluşturun.</div>'}${views[V]()}</main>
<button class="fab" onclick="openTx()">+ İşlem Ekle</button><nav>${nav.map(n=>`<button class="${V===n[0]?'on':''}" onclick="V='${n[0]}';render()">${n[1]}</button>`).join('')}</nav>`}
const sgn=t=>({gelir:1,borc_al:1,alacak_tahsil:1,gider:-1,borc_ode:-1,alacak_ver:-1}[t.type]||0);
const txRow=t=>{const A=id=>(S.accounts.find(a=>a.id===id)||{}).name||'?';const s=sgn(t);return`<div class="row"><div><b>${esc(t.cat||TYPES[t.type]||'Düzeltme')}</b> <span class="s">${esc(t.desc||'')}</span><div class="s">${t.date} · ${esc(A(t.acc))}${t.to?' → '+esc(A(t.to)):''}${t.person?' · '+esc(t.person):''} · ${t.scope==='i'?'İşletme':'Kişisel'}</div></div><div style="text-align:right"><div class="${s>0?'pos':s<0?'neg':''}"><b>${s<0?'−':s>0?'+':''}${TL(t.amt)}</b></div>${V==='tx'?`<button class="b d" style="padding:4px 8px;font-size:12px" onclick="del('${t.id}')">Sil</button>`:''}</div></div>`};
const views={
home(){const s=stats();const c=(k,v,cl='')=>`<div class="card"><div class="k">${k}</div><div class="v ${cl}">${TL(v)}</div></div>`;
return`<div class="grid">${c('Nakit + banka',s.cash)}${c('Kredi kartı borcu',s.card,'neg')}${c('Diğer borçlar',s.bo,'neg')}${c('Alacaklar',s.al,'pos')}</div>${c('Net finansal durum (nakit − borçlar + alacaklar)',s.net)}
<div class="card"><h3>Bu ay — gelir ve gider ayrı</h3>${SC!=='i'?`<div class="row"><span>Kişisel harcama</span><b class="neg">${TL(s.kg)}</b></div>`:''}${SC!=='k'?`<div class="split"><div class="card income"><div class="k">İŞLETME GELİRİ</div><div class="v pos">${TL(s.ig)}</div><button class="b" style="width:100%;margin-top:10px" onclick="openTx('gelir')">+ Gelir ekle</button></div><div class="card expense"><div class="k">İŞLETME GİDERİ</div><div class="v neg">${TL(s.ie)}</div><button class="b d" style="width:100%;margin-top:10px" onclick="openTx('gider')">+ Gider ekle</button></div></div><div class="row"><span>Gelir − gider (TAHMİNİ)</span><b>${TL(s.ik)}</b></div><div class="s">Gelir ve gider ayrı kutulardadır; gider eklerken yanlışlıkla gelir seçilmez. Bu rakam stok/malzeme tüketimi ayrıca işlenmediyse kesin net kâr değildir.</div>`:''}</div>
<div class="card"><h3>Hesaplar</h3>${accs().filter(inSc).map(accRow).join('')}</div><div class="card"><h3>Son işlemler</h3>${live().filter(t=>SC==='h'||t.scope===SC).sort((a,b)=>b.date.localeCompare(a.date)||b.u-a.u).slice(0,8).map(txRow).join('')||'<div class="s">Henüz işlem yok.</div>'}</div>`},
tx(){return`<input id="q" placeholder="Ara: açıklama, kategori, kişi, tutar…" oninput="renderList()"><div id="lst"></div>`},
acc(){return`<div class="card">${accs().filter(inSc).map(a=>accRow(a,1)).join('')}</div><div class="card"><h3>Yeni hesap</h3><label>Ad</label><input id="na"><label>Tür</label><select id="nk"><option value="bank">Banka</option><option value="cash">Nakit</option><option value="card">Kredi kartı</option></select><label>Kullanım</label><select id="ns"><option value="k">Kişisel</option><option value="i">İşletme</option><option value="h">İkisi</option></select><label>Kart limiti (kart ise)</label><input id="nl" inputmode="decimal"><button class="b" onclick="addAcc()">Hesap ekle</button></div>`},
debt(){const D=debts();const f=k=>D.filter(x=>x.k===k).map(x=>`<div class="row"><span>${esc(x.p)} <span class="s">${x.sc==='i'?'İşletme':'Kişisel'}</span></span><b>${TL(x.v)}</b></div>`).join('')||'<div class="s">Kayıt yok.</div>';return`<div class="card"><h3>Borçlarım (kalan)</h3>${f('b')}</div><div class="card"><h3>Alacaklarım (kalan)</h3>${f('a')}</div><div class="s">Kısmi ödeme için "+ İşlem Ekle" → Borç ödeme / Alacak tahsilatı seçip aynı kişi adını yazın. Ana para ödemesi gider sayılmaz.</div>`},
set(){return`<div class="card"><h3>Hesap</h3><div class="s">${sb?(user?esc(user.email)+' · '+sync:''):'Yerel mod'}</div>${sb?'<button class="b o" onclick="sb.auth.signOut()">Çıkış</button>':''}</div>
<div class="card"><h3>Yedekleme</h3><button class="b" onclick="bk()">JSON yedek indir</button> <button class="b o" onclick="csv()">CSV indir</button><br><br><label>JSON yedek yükle</label><input type="file" accept=".json" onchange="rs(this)"></div>`}};
function accRow(a,ed){const b=bal(a);const c=a.kind==='card';return`<div class="row"><div><b>${esc(a.name)}</b><div class="s">${c?`Limit ${TL(a.limit)} · Kullanılabilir ${TL(a.limit-b)}`:a.kind==='cash'?'Nakit':'Banka'}</div>${ed?`<div style="margin-top:6px"><button class="b o" style="padding:5px 9px;font-size:12px" onclick="opn('${a.id}')">Açılış</button> <button class="b o" style="padding:5px 9px;font-size:12px" onclick="rec('${a.id}')">Mutabakat</button> <button class="b d" style="padding:5px 9px;font-size:12px" onclick="arch('${a.id}')">Arşivle</button></div>`:''}</div><b class="${c?'neg':''}">${c?'Borç ':''}${TL(b)}</b></div>`}
function renderList(){const q=($('#q').value||'').toLowerCase();$('#lst').innerHTML='<div class="card">'+(live().filter(t=>(SC==='h'||t.scope===SC)&&(!q||[t.desc,t.cat,t.person,t.date,TYPES[t.type],(t.amt/100).toString()].join(' ').toLowerCase().includes(q))).sort((a,b)=>b.date.localeCompare(a.date)||b.u-a.u).map(txRow).join('')||'<div class="s">İşlem yok.</div>')+'</div>'}
const _r=render;render=function(){_r();if(V==='tx'&&$('#q'))renderList()};
/* --- işlem formu --- */
function openTx(preset){fid=uid();const o=a=>accs().map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');
const m=document.createElement('div');m.className='mod';m.id='mod';m.innerHTML=`<div class="sheet"><h3>İşlem ekle</h3>
<label>İşlem türü</label><select id="f_t" onchange="fm()">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${preset===k?'selected':''}>${v}</option>`).join('')}</select>
<label>Tutar (TL)</label><input id="f_a" inputmode="decimal" placeholder="0,00">
<label id="l_acc">Hesap</label><select id="f_c">${o()}</select>
<div id="g_to"><label>Hedef hesap</label><select id="f_to">${o()}</select></div>
<div id="g_p"><label>Kişi / firma</label><input id="f_p"></div>
<div id="g_cat"><label>Kategori</label><select id="f_cat"></select></div>
<div id="g_sc"><label>Kişisel / işletme</label><select id="f_sc"><option value="k">Kişisel</option><option value="i">İşletme</option></select></div>
<label>Tarih</label><input id="f_d" type="date" value="${today()}"><label>Açıklama (isteğe bağlı)</label><input id="f_ds">
<button class="b" id="f_ok" onclick="addTx()">Kaydet</button> <button class="b o" onclick="$('#mod').remove()">Vazgeç</button></div>`;document.body.appendChild(m);$('#f_sc').value=SC==='i'?'i':'k';fm()}
function fm(){const t=$('#f_t').value,tr=['transfer','sermaye','cekme'].includes(t),db=t.startsWith('borc')||t.startsWith('alacak');
$('#g_to').style.display=tr?'':'none';$('#g_p').style.display=db?'':'none';$('#g_cat').style.display=(t==='gelir'||t==='gider')?'':'none';$('#g_sc').style.display=(tr&&t!=='transfer')?'none':'';
$('#l_acc').textContent=tr?'Kaynak hesap':'Hesap';fc()}
function fc(){const t=$('#f_t').value,sc=$('#f_sc').value;$('#f_cat').innerHTML=(t==='gelir'?GEL:sc==='i'?CATI:CATK).map(c=>`<option>${c}</option>`).join('')}
document.addEventListener('change',e=>{if(e.target.id==='f_sc')fc()});
function addTx(){const t=$('#f_t').value,amt=parseTL($('#f_a').value);if(!(amt>0))return toast('Geçerli bir tutar girin.');
const x={id:fid,type:t,amt,acc:$('#f_c').value,date:$('#f_d').value||today(),desc:$('#f_ds').value.trim(),scope:$('#f_sc').value,u:Date.now()};
if(['transfer','sermaye','cekme'].includes(t)){x.to=$('#f_to').value;if(x.to===x.acc)return toast('Kaynak ve hedef hesap farklı olmalı.');if(t==='sermaye')x.scope='i';if(t==='cekme')x.scope='i'}
if(t==='gelir'||t==='gider')x.cat=$('#f_cat').value;if($('#g_p').style.display!=='none'){x.person=$('#f_p').value.trim();if(!x.person)return toast('Kişi / firma adı girin.')}
if(S.tx.some(y=>y.id===x.id))return;$('#f_ok').disabled=true;S.tx.push(x);save();$('#mod').remove();toast('İşlem kaydedildi.')}
function del(id){if(!confirm('Bu işlem silinsin mi? (Kayıt geçmişte saklanır, bakiye yeniden hesaplanır.)'))return;const t=S.tx.find(x=>x.id===id);t.del=1;t.u=Date.now();S.log.push({id:uid(),u:Date.now(),at:new Date().toISOString(),act:'sil',tx:JSON.parse(JSON.stringify(t))});save();toast('İşlem silindi.')}
function addAcc(){const n=$('#na').value.trim();if(!n)return toast('Hesap adı girin.');S.accounts.push({id:uid(),name:n,kind:$('#nk').value,scope:$('#ns').value,limit:Math.max(0,parseTL($('#nl').value)||0),open:0,arch:0,u:Date.now()});save();toast('Hesap eklendi.')}
function opn(id){const a=S.accounts.find(x=>x.id===id),v=prompt(a.kind==='card'?'Açılış kart borcu (TL):':'Açılış bakiyesi (TL):',(a.open/100).toString().replace('.',','));if(v===null)return;const n=parseTL(v);if(isNaN(n))return toast('Geçersiz tutar.');a.open=n;a.u=Date.now();save()}
function arch(id){if(!confirm('Hesap arşivlensin mi? (İşlem geçmişi korunur)'))return;const a=S.accounts.find(x=>x.id===id);a.arch=1;a.u=Date.now();save()}
function rec(id){const a=S.accounts.find(x=>x.id===id),v=prompt('Bankadaki gerçek '+(a.kind==='card'?'borç':'bakiye')+' (TL):');if(v===null)return;const n=parseTL(v);if(isNaN(n))return toast('Geçersiz tutar.');const d=n-bal(a);if(!d)return toast('Fark yok, bakiye tutuyor.');
if(!confirm('Fark: '+TL(d)+'. Önce eksik işlem arayın. Yine de açıklamalı düzeltme kaydı oluşturulsun mu?'))return;
const dir=a.kind==='card'?(d>0?-1:1):(d>0?1:-1);S.tx.push({id:uid(),type:'duz',amt:Math.abs(d),dir,acc:id,date:today(),desc:'Mutabakat düzeltmesi',scope:'k',u:Date.now()});save()}
function dl(n,t,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()}
const bk=()=>dl('finans-yedek-'+today()+'.json',JSON.stringify(S),'application/json');
function csv(){const A=id=>(S.accounts.find(a=>a.id===id)||{}).name||'';const r=[['Tarih','Tür','Tutar','Hesap','Hedef','Kategori','Kişi','Alan','Açıklama']].concat(live().map(t=>[t.date,TYPES[t.type]||'Düzeltme',(t.amt/100).toFixed(2),A(t.acc),A(t.to),t.cat||'',t.person||'',t.scope,t.desc||'']));dl('islemler-'+today()+'.csv','\ufeff'+r.map(x=>x.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\n'),'text/csv')}
function rs(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.accounts)||!Array.isArray(d.tx)||d.tx.some(t=>!t.id||!(t.amt>0)||!t.date||!t.type))throw 0;if(!confirm('Yedek mevcut verilerle BİRLEŞTİRİLECEK (aynı kayıtlarda en yeni olan kalır). Devam edilsin mi?'))return;S=merge(S,{...d,log:d.log||[]});save();toast('Yedek yüklendi.')}catch(e){toast('Geçersiz yedek dosyası.')}};r.readAsText(f)}
async function auth(up){if(!sb)return toast('Önce Supabase bağlantısı kurulmalı. CFG.url ve CFG.key alanlarını doldurun.');const e=$('#em').value.trim(),p=$('#pw').value;if(!e||p.length<6)return toast('Geçerli e-posta ve en az 6 karakterli şifre girin.');const{error}=up?await sb.auth.signUp({email:e,password:p}):await sb.auth.signInWithPassword({email:e,password:p});if(error)toast(error.message);else if(up)toast('Kayıt oluşturuldu. E-posta onayı açıksa onaylayın.')}
async function start(){
if(CFG.url&&CFG.key&&window.supabase){sb=supabase.createClient(CFG.url,CFG.key);
const{data}=await sb.auth.getSession();user=data.session?data.session.user:null;
sb.auth.onAuthStateChange(async(_,s)=>{const nu=s?s.user:null;if((nu&&nu.id)===(user&&user.id))return;user=nu;if(user){load();try{await pull();sync='☁️ Eşitlendi';await push()}catch(e){sync='⚠️ Bağlantı yok (yerel veriler)'}}render()})}
load();render();if(sb&&user){try{await pull();sync='☁️ Eşitlendi';render()}catch(e){sync='⚠️ Bağlantı yok (yerel veriler)'}}}
start();
</script></body></html>
